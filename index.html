<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>CIVITAS CAELESTIS · 天穹巴洛克巨城</title>
<style>
  :root{
    --gold:#d8b169;
    --gold-hi:#f7e0a8;
    --ivory:#f2e9d7;
    --ink:#070910;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    width:100%;height:100%;overflow:hidden;background:#05070d;color:var(--ivory);
    font-family:Georgia,"Times New Roman","Songti SC",SimSun,serif;
    -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;-moz-user-select:none;user-select:none;
    overscroll-behavior:none;
  }
  #scene{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:grab}
  #scene.dragging{cursor:grabbing}

  /* ---------- boot ---------- */
  #boot{
    position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at 50% 38%,#1b2135 0%,#090b14 55%,#04050a 100%);
    transition:opacity .9s ease, visibility .9s;
  }
  #boot.gone{opacity:0;visibility:hidden}
  .boot-inner{text-align:center;padding:0 24px}
  .boot-title{
    font-size:clamp(22px,4.6vw,46px);letter-spacing:.34em;text-indent:.34em;
    color:var(--gold-hi);
    text-shadow:0 0 22px rgba(226,178,88,.5),0 0 60px rgba(226,178,88,.18);
    font-weight:400;
  }
  .boot-sub{
    margin-top:14px;font-size:clamp(10px,1.6vw,13px);letter-spacing:.42em;text-indent:.42em;
    color:rgba(242,233,215,.52);
  }
  .boot-bar{
    margin:34px auto 0;width:min(320px,62vw);height:1px;background:rgba(216,177,105,.2);position:relative;overflow:hidden;
  }
  .boot-bar i{
    position:absolute;left:0;top:0;height:100%;width:0%;
    background:linear-gradient(90deg,rgba(216,177,105,.15),var(--gold-hi));
    box-shadow:0 0 12px rgba(247,224,168,.8);
    transition:width .35s ease;
  }
  .boot-note{
    margin-top:16px;font-size:11px;letter-spacing:.16em;color:rgba(242,233,215,.36);
    min-height:34px;line-height:1.7;
  }
  .boot-note small{opacity:.65;letter-spacing:.02em}

  /* ---------- hud ---------- */
  #hud{
    position:fixed;top:0;left:0;z-index:20;padding:clamp(16px,2.6vw,34px);
    pointer-events:none;transition:opacity 1s ease;
  }
  #hud.hidden{opacity:0}
  .hud-title{
    font-size:clamp(14px,2.1vw,21px);letter-spacing:.3em;text-indent:.3em;
    color:var(--gold-hi);text-shadow:0 2px 18px rgba(0,0,0,.9),0 0 24px rgba(226,178,88,.35);
  }
  .hud-sub{
    margin-top:8px;font-size:clamp(8px,1.1vw,10.5px);letter-spacing:.34em;text-indent:.34em;
    color:rgba(242,233,215,.46);text-shadow:0 1px 8px rgba(0,0,0,.9);
  }
  .hud-rule{
    margin-top:12px;width:clamp(70px,11vw,132px);height:1px;
    background:linear-gradient(90deg,var(--gold),rgba(216,177,105,0));
  }
  .hud-stats{
    margin-top:11px;font-size:9.5px;letter-spacing:.16em;color:rgba(216,177,105,.62);
    font-variant-numeric:tabular-nums;text-shadow:0 1px 8px rgba(0,0,0,.9);
  }

  /* ---------- panel ---------- */
  #panel{
    position:fixed;right:0;top:0;z-index:22;display:flex;flex-direction:column;gap:9px;
    padding:clamp(16px,2.6vw,34px);align-items:flex-end;
  }
  #panel button{
    -webkit-appearance:none;appearance:none;cursor:pointer;
    font-family:inherit;font-size:11px;letter-spacing:.2em;
    color:rgba(242,233,215,.78);
    background:rgba(10,13,22,.42);
    border:1px solid rgba(216,177,105,.3);
    padding:9px 15px;min-width:104px;text-align:center;
    backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
    transition:all .28s ease;
    clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px);
  }
  #panel button:hover,#panel button.on{
    color:#141018;background:linear-gradient(180deg,var(--gold-hi),var(--gold));
    border-color:var(--gold-hi);
    box-shadow:0 0 22px rgba(226,178,88,.5);
  }
  #panel button:active{transform:translateY(1px)}

  /* ---------- hint ---------- */
  #hint{
    position:fixed;left:50%;bottom:clamp(14px,2.4vw,26px);transform:translateX(-50%);
    z-index:20;display:flex;gap:clamp(12px,2.4vw,26px);white-space:nowrap;
    font-size:10px;letter-spacing:.2em;color:rgba(242,233,215,.34);
    pointer-events:none;text-shadow:0 1px 8px rgba(0,0,0,.9);
    transition:opacity 1s ease;
  }
  #hint span::before{content:"·";margin-right:8px;opacity:.5}
  #hint span:first-child::before{content:"";margin-right:0}

  /* ---------- toast ---------- */
  #toast{
    position:fixed;left:50%;bottom:clamp(46px,7vw,74px);transform:translate(-50%,14px);
    z-index:24;pointer-events:none;opacity:0;
    font-size:12px;letter-spacing:.26em;color:var(--gold-hi);
    text-shadow:0 0 18px rgba(226,178,88,.75),0 2px 10px rgba(0,0,0,.9);
    transition:opacity .45s ease,transform .45s cubic-bezier(.2,.9,.3,1);
  }
  #toast.show{opacity:1;transform:translate(-50%,0)}

  /* ---------- ripple ---------- */
  #ripples{position:fixed;inset:0;z-index:18;pointer-events:none;overflow:hidden}
  .ripple{
    position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;
    border:1.5px solid rgba(247,224,168,.9);
    box-shadow:0 0 18px rgba(247,224,168,.55),inset 0 0 10px rgba(247,224,168,.3);
    animation:rip .85s cubic-bezier(.16,.8,.3,1) forwards;
  }
  @keyframes rip{
    0%{transform:scale(.3);opacity:1}
    100%{transform:scale(11);opacity:0}
  }

  @media (max-width:720px){
    #panel{gap:7px}
    #panel button{min-width:0;padding:8px 11px;font-size:10px;letter-spacing:.1em}
    #hint{gap:10px;font-size:9px;letter-spacing:.1em}
    .hud-sub{display:none}
  }
  @media (max-height:520px){
    #hint{display:none}
  }
</style>

<script>
  window.__bootFail = function(msg){
    var n = document.getElementById('bootnote');
    if (n) n.innerHTML = '资源加载失败，请检查网络后刷新。<br><small>' + (msg||'') + '</small>';
  };
  window.addEventListener('error', function(e){
    if (!window.__ready) window.__bootFail(e.message || 'script error');
  }, true);
  window.addEventListener('unhandledrejection', function(e){
    if (!window.__ready) window.__bootFail((e.reason && e.reason.message) || String(e.reason));
  });
</script>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }

</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* =========================================================================
   0. 引导 / 进度
   ========================================================================= */
const $ = (id) => document.getElementById(id);
const bootbar = $('bootbar'), bootnote = $('bootnote');
const tick = (p, msg) => new Promise((res) => {
  bootbar.style.width = (p * 100).toFixed(1) + '%';
  if (msg) bootnote.textContent = msg;
  requestAnimationFrame(() => setTimeout(res, 0));
});

/* =========================================================================
   1. 调色板 —— 象牙白 / 暖金 / 赭石 / 灰蓝 / 深红
   ========================================================================= */
const C = {
  ivory:    0xf3e9d6, ivory2: 0xe4d7bd, ivory3: 0xd2c2a2, ivory4: 0xb9a687,
  cream:    0xfcf6e9, bone:   0xc8b696,

  gold:     0xe0b055, goldHi:0xf9dfa0, goldDeep:0xb07f2a, goldDark:0x7c5a1f,
  bronze:   0x9a6b3d, copper:0xa9613a,

  ochre:    0xa87a48, ochre2:0x9c6b40, ochre3:  0x7a5130, terra: 0x8f4430,

  slate:    0x6b7d95, slate2:0x8b9cb2, slate3:  0x4a5a70, slate4:0x33404f,

  red:      0x8f3038, red2:  0x6b2028, red3:   0xb04a44, crimson:0x7a1f2b,

  water:    0x63aec4, water2:0x9adbe6, waterDeep:0x3d7f96,

  rock1:    0x8a7260, rock2: 0x6f5849, rock3:  0x54443a, rock4: 0x3d322b,
  moss:     0x69784a, moss2: 0x53613a,

  hedge:    0x3f6034, hedge2:0x577c42, hedge3:  0x2c4524,

  cloud1:   0xf8f4ec, cloud2:0xe6e0d3, cloud3:  0xd2cbbd,

  lamp:     0xffc978, glass: 0x2b3a4d, glass2:  0x3f5468, glass3:0x1d2836,
};

const METALS = new Set([C.gold, C.goldHi, C.goldDeep, C.goldDark, C.bronze, C.copper]);
const WATERS = new Set([C.water, C.water2, C.waterDeep]);
const GLASSES = new Set([C.glass, C.glass2, C.glass3]);

const matCache = new Map();
function matFor(color){
  let m = matCache.get(color);
  if (m) return m;
  if (METALS.has(color)){
    m = new THREE.MeshStandardMaterial({ color, metalness: 0.94, roughness: 0.17, envMapIntensity: 1.65 });
  } else if (WATERS.has(color)){
    m = new THREE.MeshStandardMaterial({ color, metalness: 0.22, roughness: 0.08, envMapIntensity: 0.62 });
  } else if (GLASSES.has(color)){
    m = new THREE.MeshStandardMaterial({ color, metalness: 0.55, roughness: 0.14, envMapIntensity: 0.72 });
  } else if (color === C.lamp){
    m = new THREE.MeshStandardMaterial({ color: 0xffdca0, emissive: 0xffa63c, emissiveIntensity: 0.15, roughness: 0.45, metalness: 0 });
  } else if (color === C.hedge || color === C.hedge2 || color === C.hedge3 || color === C.moss || color === C.moss2){
    m = new THREE.MeshStandardMaterial({ color, metalness: 0, roughness: 1.0 });
  } else {
    m = new THREE.MeshStandardMaterial({ color, metalness: 0, roughness: 0.9 });
  }
  matCache.set(color, m);
  return m;
}

/* =========================================================================
   2. 体素容器 —— 稀疏体素 + 内表面剔除
   ========================================================================= */
const OFF = 380, SPAN = 1024;
const vk = (x, y, z) => ((x + OFF) * SPAN + (y + OFF)) * SPAN + (z + OFF);

class Vox {
  constructor(){ this.m = new Map(); }
  /** 单点 */
  p(x, y, z, c){
    this.m.set(vk(Math.round(x), Math.round(y), Math.round(z)), c);
  }
  /** 镜像点（沿 X 轴，城市中轴 = 0） */
  s(x, y, z, c){
    x = Math.round(x); y = Math.round(y); z = Math.round(z);
    this.m.set(vk(x, y, z), c);
    if (x !== 0) this.m.set(vk(-x, y, z), c);
  }
  has(x, y, z){ return this.m.has(vk(x, y, z)); }
  del(x, y, z){ this.m.delete(vk(x, y, z)); }
}

/** 提取外表面体素（六邻域全被占据的内部块剔除） */
function surfaceList(vox){
  const m = vox.m, out = [];
  for (const [k, c] of m){
    const z = k % SPAN;
    const t = (k - z) / SPAN;
    const y = t % SPAN;
    const x = (t - y) / SPAN;
    const X = x - OFF, Y = y - OFF, Z = z - OFF;
    if (m.has(vk(X + 1, Y, Z)) && m.has(vk(X - 1, Y, Z)) &&
        m.has(vk(X, Y + 1, Z)) && m.has(vk(X, Y - 1, Z)) &&
        m.has(vk(X, Y, Z + 1)) && m.has(vk(X, Y, Z - 1))) continue;
    out.push(X, Y, Z, c);
  }
  return out;
}

/* =========================================================================
   3. 建筑语法库 —— 巴洛克构件，全部由方块砌筑
   ========================================================================= */

/** 实心圆盘（单层） */
function discFill(V, cx, y, cz, r, c, sym){
  const R = Math.ceil(r) + 1, R2 = r * r + 0.35;
  for (let dx = -R; dx <= R; dx++)
    for (let dz = -R; dz <= R; dz++){
      if (dx * dx + dz * dz > R2) continue;
      if (sym === false) V.p(cx + dx, y, cz + dz, c);
      else V.s(cx + dx, y, cz + dz, c);
    }
}

/** 圆环（单层） */
function ringFill(V, cx, y, cz, rOut, rIn, c, sym){
  const R = Math.ceil(rOut) + 1, Ro2 = rOut * rOut + 0.35, Ri2 = Math.max(0, rIn * rIn - 0.35);
  for (let dx = -R; dx <= R; dx++)
    for (let dz = -R; dz <= R; dz++){
      const d2 = dx * dx + dz * dz;
      if (d2 > Ro2 || d2 < Ri2) continue;
      if (sym === false) V.p(cx + dx, y, cz + dz, c);
      else V.s(cx + dx, y, cz + dz, c);
    }
}

/** 空心圆筒 */
function cylinder(V, cx, y0, cz, r, h, c, opt){
  opt = opt || {};
  const wall = opt.wall === undefined ? 1.8 : opt.wall;
  const sym = opt.sym;
  for (let i = 0; i < h; i++){
    if (opt.solid) discFill(V, cx, y0 + i, cz, r, c, sym);
    else ringFill(V, cx, y0 + i, cz, r, Math.max(0, r - wall), c, sym);
  }
}

/** 阶梯穹顶 —— 巴洛克饱满剖面 */
function dome(V, cx, cy, cz, R, H, o){
  const main = o.main, rib = o.rib, gold = o.gold || C.gold;
  const ribs = o.ribs || 20;
  const thick = o.thick || 1.9;
  const seg = Math.PI * 2 / ribs;
  const shape = o.shape || 1.0; // >1 更饱满
  const bandEvery = Math.max(2, Math.round(H / 7));
  for (let i = 0; i <= H; i++){
    const t = i / H;
    let r = R * Math.sqrt(Math.max(0, 1 - Math.pow(t, shape)));
    if (r < 0.75) r = 0;
    const Ro2 = r * r + 0.35;
    const Ri = Math.max(0, r - thick);
    const Ri2 = Math.max(0, Ri * Ri - 0.35);
    const L = Math.ceil(r) + 1;
    for (let dx = -L; dx <= L; dx++)
      for (let dz = -L; dz <= L; dz++){
        const d2 = dx * dx + dz * dz;
        if (d2 > Ro2 || d2 < Ri2) continue;
        let col = main;
        const ang = Math.atan2(dz, dx);
        const k = Math.round(ang / seg);
        if (Math.abs(ang - k * seg) * Math.max(2.2, r) < 1.05) col = rib;
        if (i % bandEvery === 0 && i < H) col = gold;
        V.s(cx + dx, cy + i, cz + dz, col);
      }
  }
}

/** 鼓座（带拱窗） */
function drum(V, cx, cy, cz, R, H, o){
  const main = o.main, gold = o.gold || C.gold, win = o.win || C.glass;
  const walls = o.wall === undefined ? 2.0 : o.wall;
  for (let i = 0; i < H; i++)
    ringFill(V, cx, cy + i, cz, R, Math.max(0, R - walls), main);
  // 檐口
  ringFill(V, cx, cy + H, cz, R + 1.6, Math.max(0, R - 1.2), gold);
  ringFill(V, cx, cy - 1, cz, R + 1.2, Math.max(0, R - 1.4), o.acc || C.ivory3);

  // 拱窗
  const n = o.winN || 8;
  for (let w = 0; w < n; w++){
    const a = (w + 0.5) / n * Math.PI * 2;
    const ca = Math.cos(a), sa = Math.sin(a);
    const tx = -sa, tz = ca;
    const wx = cx + ca * R, wz = cz + sa * R;
    const hw = o.winW || 1.6;
    const wh = Math.round(H * 0.56);
    const base = cy + Math.round(H * 0.16);
    for (let u = -Math.ceil(hw); u <= Math.ceil(hw); u++){
      for (let v = 0; v < wh; v++){
        // 拱形顶
        const top = wh - 1;
        if (v > top - 2 && Math.abs(u) > hw * 0.35) continue;
        V.s(Math.round(wx + tx * u), base + v, Math.round(wz + tz * u), win);
      }
    }
    // 窗框
    for (let v = -1; v <= wh; v++){
      V.s(Math.round(wx + tx * (hw + 1)), base + v, Math.round(wz + tz * (hw + 1)), gold);
      V.s(Math.round(wx + tx * (-hw - 1)), base + v, Math.round(wz + tz * (-hw - 1)), gold);
    }
  }
}

/** 立柱（带凹槽柱身 + 柱础 + 柱头） */
function column(V, x, z, y0, h, w, o){
  const hw = (w - 1) / 2;
  const shaft = o.shaft, edge = o.edge || o.shaft, lite = o.lite || o.shaft;
  const cap = o.cap || o.shaft;
  const base = o.base || o.shaft;

  // 柱础
  for (let i = 0; i < 2; i++){
    const e = hw + (i === 0 ? 1 : 0);
    for (let dx = -e; dx <= e; dx++)
      for (let dz = -e; dz <= e; dz++)
        V.s(x + dx, y0 + i, z + dz, i === 0 ? base : o.shaft);
  }
  // 柱身
  for (let i = 2; i < h - 3; i++){
    for (let dx = -hw; dx <= hw; dx++)
      for (let dz = -hw; dz <= hw; dz++){
        const ex = Math.abs(dx) === hw, ez = Math.abs(dz) === hw;
        let c;
        if (ex && ez) c = shaft;
        else if (ex || ez) c = edge;
        else c = lite;
        V.s(x + dx, y0 + i, z + dz, c);
      }
  }
  // 柱头：螺旋涡卷托架（四角）
  const cy = y0 + h - 3;
  for (let dx = -hw - 1; dx <= hw + 1; dx++)
    for (let dz = -hw - 1; dz <= hw + 1; dz++){
      V.s(x + dx, cy, z + dz, cap);
      V.s(x + dx, cy + 1, z + dz, Math.abs(dx) > hw || Math.abs(dz) > hw ? cap : o.shaft);
    }
  // abacus
  for (let dx = -hw - 2; dx <= hw + 2; dx++)
    for (let dz = -hw - 2; dz <= hw + 2; dz++)
      V.s(x + dx, cy + 2, z + dz, o.acc || cap);
  // 四角涡卷
  volute(V, x + hw + 1, cy, z + hw + 1, 2.2, 1.15, 1, o.acc || C.gold, cap, 'z');
}

/** 涡卷（阿基米德螺线体素化）—— 巴洛克的签名笔触 */
function volute(V, cx, cy, cz, R, turns, depth, cOut, cIn, axis){
  axis = axis || 'z';
  const total = turns * Math.PI * 2;
  const steps = Math.max(30, Math.ceil(total * R * 2.2));
  for (let s = 0; s <= steps; s++){
    const t = s / steps;
    const th = t * total;
    const rr = R * (1 - 0.84 * t);
    for (let w = 0; w < 2; w++){
      const r2 = rr - w * 1.18;
      if (r2 < 0) continue;
      const a = Math.cos(th) * r2, b = Math.sin(th) * r2;
      for (let d = 0; d < depth; d++){
        const col = (d === 0 || d === depth - 1) ? cOut : cIn;
        if (axis === 'z') V.s(cx + a, cy + b, cz + d, col);
        else V.s(cx + d, cy + b, cz + a, col);
      }
    }
  }
}

/** 山花（三角楣），broken=true 为断山花 */
function pediment(V, cxx, cy, cz, halfW, H, depth, o, broken){
  const trim = o.trim, face = o.face;
  for (let i = 0; i <= H; i++){
    const t = i / H;
    const hw = Math.round(halfW * (1 - t));
    for (let dx = -hw; dx <= hw; dx++){
      if (broken && i > H * 0.3 && Math.abs(dx) < hw * 0.44) continue;
      const isEdge = Math.abs(Math.abs(dx) - hw) < 0.6 || i === 0 || i === H;
      for (let d = 0; d < depth; d++)
        V.s(cxx + dx, cy + i, cz + d, isEdge ? trim : face);
    }
  }
  if (broken){
    // 断口处内卷
    for (const sx of [-1, 1]){
      const bx = cxx + sx * Math.round(halfW * 0.5);
      volute(V, bx, cy + Math.round(H * 0.34), cz, Math.max(1.6, H * 0.26), 1.05, depth, trim, face, 'z');
    }
  }
}

/** 拱券 */
function arch(V, cx, cy, cz, R, thick, depth, cOut, cIn){
  const steps = Math.max(24, Math.ceil(Math.PI * R * 1.5));
  for (let s = 0; s <= steps; s++){
    const a = Math.PI * s / steps;
    for (let t = 0; t < thick; t++){
      const rr = R - t;
      const X = Math.round(Math.cos(a) * rr), Y = Math.round(Math.sin(a) * rr);
      for (let d = 0; d < depth; d++)
        V.s(cx + X, cy + Y, cz + d, t === 0 ? cOut : cIn);
    }
  }
}

/** 栏杆 */
function balustrade(V, x0, z0, x1, z1, y, o){
  const dx = x1 - x0, dz = z1 - z0;
  const len = Math.hypot(dx, dz);
  const n = Math.max(1, Math.round(len));
  for (let i = 0; i <= n; i++){
    const t = i / n;
    const x = x0 + dx * t, z = z0 + dz * t;
    V.s(x, y, z, o.base || o.post);
    V.s(x, y + 3, z, o.rail || o.post);
    if (i % 2 === 0){
      V.s(x, y + 1, z, o.post);
      V.s(x, y + 2, z, o.post);
    }
  }
}

/** 大台阶 */
function stairs(V, cx, z0, z1, y0, y1, halfW, o){
  const n = Math.abs(y1 - y0) || 1;
  const dir = Math.sign(z1 - z0);
  for (let i = 0; i <= n; i++){
    const y = y0 + i;
    const za = z0 + (z1 - z0) * i / (n + 1);
    const zb = z0 + (z1 - z0) * (i + 1) / (n + 1);
    const zA = Math.round(Math.min(za, zb)), zB = Math.round(Math.max(za, zb));
    for (let z = zA; z <= zB; z++){
      for (let x = -halfW; x <= halfW; x++){
        const edge = Math.abs(x) >= halfW - 1;
        V.s(cx + x, y, z, edge ? o.edge : (i % 2 ? o.a : o.b));
        if (i > 0) V.s(cx + x, y - 1, z, o.a);
      }
    }
  }
  // 两侧扶手（阶梯状下降）
  for (const sx of [-1, 1]){
    for (let i = 0; i <= n; i++){
      const y = y0 + i;
      const za = z0 + (z1 - z0) * i / (n + 1);
      const zb = z0 + (z1 - z0) * (i + 1) / (n + 1);
      const zA = Math.round(Math.min(za, zb)), zB = Math.round(Math.max(za, zb));
      for (let z = zA; z <= zB; z++){
        V.s(cx + sx * (halfW + 1), y + 1, z, o.edge);
        V.s(cx + sx * (halfW + 1), y + 2, z, o.rail || o.edge);
        if (i % 3 === 0) V.p(cx + sx * (halfW + 2), y + 3, z, o.rail || o.edge);
      }
    }
  }
}

/** 镀金尖饰 */
function finial(V, x, y, z, h, c, cBall){
  const ball = cBall || c;
  for (let i = 0; i < h; i++){
    const t = i / h;
    const w = Math.max(0, Math.round((1 - t) * h * 0.34));
    for (let dx = -w; dx <= w; dx++)
      for (let dz = -w; dz <= w; dz++)
        V.s(x + dx, y + i, z + dz, i === 0 ? ball : c);
  }
  V.s(x, y + h, z, c);
}

/** 雕像（简化人形） */
function statue(V, x, y, z, c, cDark, h){
  h = h || 8;
  const s = h / 8;
  const R = (n) => Math.round(n * s);
  // 基座
  for (let dx = -1; dx <= 1; dx++) for (let dz = -1; dz <= 1; dz++) V.s(x + dx, y, z + dz, cDark);
  // 长袍（下宽上窄）
  for (let i = 1; i <= R(3); i++){
    const w = i <= R(1) ? 2 : 1;
    for (let dx = -w; dx <= w; dx++) for (let dz = -1; dz <= 1; dz++)
      V.s(x + dx, y + i, z + dz, (dx === w || dx === -w) ? cDark : c);
  }
  // 躯干
  for (let i = R(4); i <= R(5); i++)
    for (let dx = -1; dx <= 1; dx++) for (let dz = -1; dz <= 1; dz++)
      V.s(x + dx, y + i, z + dz, dz === 1 ? c : cDark);
  // 手臂
  V.s(x - 2, y + R(5), z, c);
  V.s(x + 2, y + R(5), z, c);
  V.s(x + 2, y + R(5) + 1, z + 1, c);
  // 头
  V.s(x, y + R(6), z, c);
  V.s(x, y + R(6) + 1, z, c);
  V.s(x, y + R(6), z + 1, cDark);
}

/** 绿篱（修剪成型的几何体） */
function hedgeBox(V, x0, z0, x1, z1, y, h, c, cTop){
  for (let x = Math.min(x0,x1); x <= Math.max(x0,x1); x++)
    for (let z = Math.min(z0,z1); z <= Math.max(z0,z1); z++)
      for (let i = 0; i < h; i++)
        V.s(x, y + i, z, i === h - 1 ? (cTop || c) : c);
}

/** 水面矩形 */
function pool(V, x0, z0, x1, z1, y, c){
  for (let x = Math.min(x0,x1); x <= Math.max(x0,x1); x++)
    for (let z = Math.min(z0,z1); z <= Math.max(z0,z1); z++)
      V.s(x, y, z, c);
}

/** 高台（只砌顶面 + 侧壁，内部中空） */
function plateau(V, x0, z0, x1, z1, yTop, yBot, cTop, cSide, cEdge){
  for (let x = x0; x <= x1; x++)
    for (let z = z0; z <= z1; z++) V.s(x, yTop, z, cTop);
  for (let y = yBot; y < yTop; y++){
    for (let x = x0; x <= x1; x++){
      V.s(x, y, z0, cSide); V.s(x, y, z1, cSide);
      if (y === yTop - 1 || y === yBot){ V.s(x, y, z0, cEdge); V.s(x, y, z1, cEdge); }
    }
    for (let z = z0 + 1; z < z1; z++){
      V.s(x0, y, z, cSide); V.s(x1, y, z, cSide);
      if (y === yTop - 1 || y === yBot){ V.s(x0, y, z, cEdge); V.s(x1, y, z, cEdge); }
    }
  }
}

/** 浮空岛岩体（倒锥 + 分层岩色） */
function islandRock(V, cx, cy, cz, R, depth, o){
  const rim = o.rim || 2.6;
  for (let i = 0; i < depth; i++){
    const t = i / depth;
    let r = R * Math.pow(1 - t, 0.52) * (0.82 + Math.random() * 0.34);
    if (r < 1.2) r = 1.2;
    const y = cy - i;
    const bd = Math.floor((i + (i >> 3) * 5) / 4) % 3; let c = bd === 0 ? C.rock1 : (bd === 1 ? C.rock2 : C.rock3);
    if (t > 0.72) c = i % 7 < 4 ? C.rock3 : C.rock4;
    if (i === 0) c = o.rimColor || C.ivory4;
    ringFill(V, cx, y, cz, r, Math.max(0, r - rim), c, o.sym === true ? true : false);
  }
  // 岩体竖片：打破水平层理
  for (let k = 0; k < Math.max(18, R * 1.6); k++){
    const a = Math.random() * Math.PI * 2;
    const ri = R * (0.42 + Math.random() * 0.56);
    const px0 = cx + Math.round(Math.cos(a) * ri);
    const pz0 = cz + Math.round(Math.sin(a) * ri);
    const y0 = cy - Math.round(Math.random() * depth * 0.82);
    const len = 3 + Math.round(Math.random() * 12);
    for (let q = 0; q < len; q++){
      const cc = Math.random() < 0.5 ? C.rock3 : C.rock4;
      const px = o.sym ? Math.abs(px0) : px0;
      V.p(px, y0 - q, pz0, cc);
      if (o.sym && px !== 0) V.p(-px, y0 - q, pz0, cc);
    }
  }
  // 底部碎石垂挂
  for (let i = 0; i < 30; i++){
    const a = i / 30 * Math.PI * 2 + 0.4;
    const rr = R * 0.3;
    const x = Math.round(cx + Math.cos(a) * rr * (0.4 + Math.random() * 0.9));
    const z = Math.round(cz + Math.sin(a) * rr * (0.4 + Math.random() * 0.9));
    const len = 4 + Math.round(Math.random() * 16);
    for (let k = 0; k < len; k++){
      const px = o.sym ? Math.abs(x) : x;
      V.p(px, cy - depth - k, z, k < len * 0.5 ? C.rock3 : C.rock4);
      if (o.sym && px !== 0) V.p(-px, cy - depth - k, z, k < len * 0.5 ? C.rock3 : C.rock4);
    }
  }
}

/** 棋盘铺地 */
function pavePattern(V, x0, z0, x1, z1, y, o){
  const a = o.a, b = o.b, acc = o.acc;
  for (let x = x0; x <= x1; x++)
    for (let z = z0; z <= z1; z++){
      let c = ((x + z) & 1) ? a : b;
      if (acc && ((x * 5 + z * 11) % 29 === 0)) c = acc;
      V.p(x, y, z, c);
    }
}

/* =========================================================================
   4. 单座建筑 —— 巴洛克大教堂
   ========================================================================= */
function cathedral(V){
  const Y = 10;
  const NX = 22;        // 中殿半宽
  const ZF = -10;       // 立面外皮
  const ZB = -48;       // 后墙 / 穹顶中心
  const TOP = Y + 32;   // 42 —— 中殿檐口

  /* ---------- 中殿侧墙 ---------- */
  for (let z = ZB; z <= ZF; z++){
    for (let y = Y; y <= TOP; y++){
      V.s(NX, y, z, C.ivory2);
      V.s(NX - 1, y, z, C.ivory3);
      if (((z - ZB) % 8) === 0){
        V.s(NX + 1, y, z, C.ivory);
        V.s(NX + 1, y, z + 1, C.ivory3);
        V.s(NX, y, z, C.ivory);
      }
    }
  }
  // 高窗
  for (let z = ZB + 4; z <= ZF - 4; z += 8){
    for (let y = Y + 18; y <= Y + 27; y++){
      for (let dz = 0; dz < 3; dz++){
        const top = y - (Y + 18);
        const half = 1.5;
        V.s(NX, y, z + dz, C.glass);
        if (top > 6) V.s(NX - 1, y, z + dz, C.glass2);
      }
    }
    // 窗框
    for (let y = Y + 17; y <= Y + 29; y++){
      V.s(NX, y, z - 1, C.ivory);
      V.s(NX, y, z + 3, C.ivory);
    }
  }
  // 檐口
  for (let z = ZB - 2; z <= ZF + 2; z++){
    for (let dx = NX - 1; dx <= NX + 2; dx++){
      V.s(dx, TOP + 1, z, C.ivory);
      V.s(dx, TOP + 2, z, C.gold);
      V.s(dx, TOP + 3, z, C.ivory3);
    }
  }
  // 屋顶
  for (let x = -NX; x <= NX; x++)
    for (let z = ZB; z <= ZF; z++)
      V.p(x, TOP + 3, z, ((x + z) & 1) ? C.slate3 : C.slate4);

  /* ---------- 后殿（半圆柱） ---------- */
  for (let y = Y; y <= TOP; y++){
    ringFill(V, 0, y, ZB, 22, 20, C.ivory2, false);
  }
  for (let y = Y; y <= TOP; y++){
    ringFill(V, 0, y, ZB, 22, 21.2, C.ivory3, false);
  }
  // 后殿檐口
  for (let y = TOP + 1; y <= TOP + 2; y++)
    ringFill(V, 0, y, ZB, 24, 20, y === TOP + 1 ? C.ivory : C.gold, false);

  /* ---------- 扶壁（buttress）---------- */
  for (let z = ZB + 2; z <= ZF - 2; z += 8){
    for (let y = Y; y <= TOP; y++){
      for (let dx = NX + 1; dx <= NX + 3; dx++){
        V.s(dx, y, z, C.ivory2);
        V.s(dx, y, z + 1, C.ivory3);
      }
    }
    // 扶壁顶的涡卷托架
    volute(V, NX + 2, TOP - 3, z, 2.8, 1.2, 2, C.gold, C.ivory, 'z');
  }

  /* ---------- 立面 ---------- */
  const HW = 34;
  const FT = Y + 36;   // 46
  const doorHalf = 9, doorH = 22;
  for (let x = -HW; x <= HW; x++){
    for (let y = Y; y <= FT; y++){
      let open = false;
      if (Math.abs(x) <= doorHalf && y <= Y + doorH) open = true;
      if (Math.abs(x) <= doorHalf && y > Y + doorH){
        const dy = y - (Y + doorH);
        if (dy <= doorHalf && Math.abs(x) <= Math.sqrt(doorHalf * doorHalf - dy * dy)) open = true;
      }
      if (open) continue;
      for (let d = 0; d < 5; d++) V.p(x, y, ZF - d, d < 2 ? C.ivory2 : C.ivory3);
    }
  }
  // 门内：铜门 + 金光
  for (let x = -doorHalf; x <= doorHalf; x++){
    for (let y = Y; y <= Y + doorH + doorHalf; y++){
      const dy = y - (Y + doorH);
      const inArch = dy <= 0 ? Math.abs(x) <= doorHalf : (dy <= doorHalf && Math.abs(x) <= Math.sqrt(Math.max(0, doorHalf*doorHalf - dy*dy)));
      if (!inArch) continue;
      const c = (Math.abs(x) % 4 === 0) ? C.goldDeep : C.bronze;
      V.p(x, y, ZF - 6, c);
    }
  }
  // 门框
  for (let y = Y - 1; y <= Y + doorH + doorHalf + 1; y++){
    V.s(doorHalf + 1, y, ZF - 6, C.gold);
    V.s(doorHalf + 1, y, ZF - 5, C.goldDeep);
  }

  // 立面壁柱
  for (const px of [13, 20, 27, 33]){
    for (let y = Y; y <= FT; y++){
      V.s(px, y, ZF - 1, C.ivory);
      V.s(px + 1, y, ZF - 1, C.ivory3);
      V.s(px - 1, y, ZF - 1, C.ivory3);
    }
  }
  // 立面上的壁龛雕像
  for (const px of [16.5, 23.5, 30]){
    for (let y = Y + 12; y <= Y + 26; y++) V.s(Math.round(px), y, ZF - 1, C.slate3);
    statue(V, Math.round(px), Y + 12, ZF - 2, C.ivory, C.ivory4, 12);
  }

  // 门廊巨柱（成对）
  for (const px of [12, 22, 32]){
    column(V, px, -2, Y - 1, 34, 5, {
      shaft: C.ivory, edge: C.ivory3, lite: C.cream,
      cap: C.ivory, base: C.ivory2, acc: C.gold
    });
  }
  // 门廊顶（entablature）
  for (let x = -HW - 3; x <= HW + 3; x++)
    for (let z = ZF - 1; z <= 1; z++){
      V.p(x, Y + 34, z, C.ivory);
      V.p(x, Y + 35, z, C.ivory3);
      V.p(x, Y + 36, z, C.gold);
    }
  // 断山花
  pediment(V, 0, Y + 37, ZF - 1, 37, 12, 3, { trim: C.ivory, face: C.ivory2 }, true);
  // 山花顶饰
  finial(V, 0, Y + 49, ZF, 5, C.gold);
  // 山花两侧涡卷
  for (const sx of [-1, 1]){
    volute(V, sx * 30, Y + 40, ZF - 1, 4.2, 1.35, 3, C.gold, C.ivory2, 'z');
  }
  // 立面顶部栏杆 + 雕像
  balustrade(V, -HW, ZF - 1, -8, ZF - 1, Y + 37, { post: C.ivory, rail: C.ivory, base: C.ivory3 });
  balustrade(V, 8, ZF - 1, HW, ZF - 1, Y + 37, { post: C.ivory, rail: C.ivory, base: C.ivory3 });

  /* ---------- 鼓座 + 大穹顶 ---------- */
  const DC = ZB;         // 穹顶中心 z
  const DR = 18;
  // 过渡鼓环（pendentive 视觉）
  for (let y = TOP + 3; y <= TOP + 6; y++)
    ringFill(V, 0, y, DC, 15 + (y - TOP) * 1.1, 12 + (y - TOP) * 1.1, C.ivory2, false);
  drum(V, 0, TOP + 7, DC, DR, 16, {
    main: C.ivory2, gold: C.gold, win: C.glass, winN: 10, winW: 1.8, wall: 2.2, acc: C.ivory3
  });
  // 穹顶
  dome(V, 0, TOP + 24, DC, DR, 26, {
    main: C.ivory, rib: C.goldHi, gold: C.goldDeep, ribs: 24, thick: 2.0, shape: 1.15
  });
  // 穹顶底檐
  for (let y = TOP + 23; y <= TOP + 24; y++)
    ringFill(V, 0, y, DC, DR + 1.4, DR - 2, y === TOP + 23 ? C.gold : C.ivory, false);

  // 采光亭 lantern
  const LY = TOP + 50;
  cylinder(V, 0, LY, DC, 5.5, 8, C.ivory, { hollow: true, wall: 1.6, sym: false });
  for (let i = 0; i < 8; i++){
    const a = i / 8 * Math.PI * 2;
    V.p(Math.round(Math.cos(a) * 5.5), LY + 3, Math.round(DC + Math.sin(a) * 5.5), C.glass);
  }
  ringFill(V, 0, LY + 8, DC, 6.5, 4, C.gold, false);
  dome(V, 0, LY + 9, DC, 5.5, 6, { main: C.goldHi, rib: C.gold, gold: C.goldDeep, ribs: 8, thick: 1.4 });
  finial(V, 0, LY + 15, DC, 7, C.gold, C.goldHi);
  // 十字
  for (let y = 0; y < 7; y++) V.p(0, LY + 22 + y, DC, C.goldHi);
  for (let x = -3; x <= 3; x++) V.p(x, LY + 25, DC, C.goldHi);

  /* ---------- 双钟塔 ---------- */
  for (const s of [1]){
    bellTower(V, 28, -16);
  }

  /* ---------- 屋顶栏杆 ---------- */
  balustrade(V, -NX, ZF, NX, ZF, TOP + 4, { post: C.ivory, rail: C.ivory, base: C.ivory3 });
  for (const sx of [-1, 1]){
    balustrade(V, sx * NX, ZB, sx * NX, ZF, TOP + 4, { post: C.ivory, rail: C.ivory, base: C.ivory3 });
  }
}

/** 钟塔 */
function bellTower(V, TX, TZ){
  const Y = 10, H = 52;
  const R = 5;
  for (let y = Y; y <= Y + H; y++){
    for (let dx = -R; dx <= R; dx++)
      for (let dz = -R; dz <= R; dz++){
        const ex = Math.abs(dx) === R, ez = Math.abs(dz) === R;
        if (!ex && !ez) continue;
        let c = C.ivory2;
        if (ex && ez) c = C.ivory;
        if (y % 13 === 0) c = C.ivory3;
        V.s(TX + dx, y, TZ + dz, c);
      }
  }
  // 塔身壁柱（转角）
  for (let y = Y; y <= Y + H; y++){
    V.s(TX + R + 1, y, TZ + R, C.ivory);
    V.s(TX + R, y, TZ + R + 1, C.ivory);
  }
  // 钟窗（大拱洞）
  for (let y = Y + 32; y <= Y + 44; y++){
    for (let dx = -2; dx <= 2; dx++){
      const dy = y - (Y + 40);
      const half = dy <= 0 ? 2 : (dy <= 4 ? Math.round(Math.sqrt(Math.max(0, 16 - dy * dy))) : 0);
      if (Math.abs(dx) > half && dy > 0) continue;
      V.s(TX + dx, y, TZ + R, C.glass3);
      V.s(TX + dx, y, TZ - R, C.glass3);
    }
  }
  // 檐口
  for (let y = Y + H + 1; y <= Y + H + 2; y++)
    for (let dx = -R - 1; dx <= R + 1; dx++)
      for (let dz = -R - 1; dz <= R + 1; dz++){
        if (Math.abs(dx) < R && Math.abs(dz) < R) continue;
        V.s(TX + dx, y, TZ + dz, y === Y + H + 1 ? C.ivory : C.gold);
      }
  // 塔顶小穹顶
  drum(V, TX, Y + H + 3, TZ, 4.2, 5, { main: C.ivory, gold: C.gold, win: C.glass, winN: 6, winW: 1.1, wall: 1.4 });
  dome(V, TX, Y + H + 8, TZ, 4.6, 7, { main: C.ivory, rib: C.ivory3, gold: C.gold, ribs: 10, thick: 1.4 });
  finial(V, TX, Y + H + 16, TZ, 6, C.gold, C.goldHi);
  // 塔身雕像
  statue(V, TX, Y + 8, TZ + R + 1, C.ivory, C.ivory4, 10);
}

/* =========================================================================
   5. 侧翼建筑（拱券连廊 + 涡卷托架）
   ========================================================================= */
function wing(V, WX, Z0, Z1, H){
  const Y = 10;
  const HW = 6;
  // 主体
  for (let z = Z1; z <= Z0; z++){
    for (let y = Y; y <= Y + H; y++){
      for (let dx = -HW; dx <= HW; dx++){
        const ex = Math.abs(dx) === HW, ez = false;
        if (!ex) continue;
        V.s(WX + dx, y, z, C.ochre);
      }
    }
  }
  // 拱券连廊（朝中轴一侧）
  for (let z = Z1; z <= Z0 - 8; z += 9){
    arch(V, WX - HW - 2, Y + 14, z, 4.5, 1.5, 2, C.ivory, C.ivory3);
    // 拱柱
    for (let y = Y; y <= Y + 14; y++){
      V.s(WX - HW - 2 - 4, y, z + 4, C.ivory2);
      V.s(WX - HW - 2 + 4, y, z + 4, C.ivory2);
    }
  }
  // 檐口
  for (let z = Z1 - 1; z <= Z0 + 1; z++)
    for (let dx = -HW - 1; dx <= HW + 1; dx++){
      V.s(WX + dx, Y + H + 1, z, C.ivory);
      V.s(WX + dx, Y + H + 2, z, C.gold);
    }
  // 屋顶
  for (let z = Z1; z <= Z0; z++)
    for (let dx = -HW; dx <= HW; dx++)
      V.s(WX + dx, Y + H + 2, z, C.terra);
  // 屋顶檐口的涡卷托架
  for (let z = Z1 + 2; z <= Z0 - 2; z += 6){
    volute(V, WX - HW - 1, Y + H - 3, z, 2.6, 1.2, 2, C.gold, C.ochre, 'z');
  }
  // 屋顶栏杆 + 雕像
  balustrade(V, WX - HW, Z1, WX - HW, Z0, Y + H + 3, { post: C.ivory, rail: C.ivory, base: C.ivory3 });
  for (let z = Z1 + 6; z <= Z0 - 6; z += 14)
    statue(V, WX - HW, Y + H + 3, z, C.ivory, C.ivory4, 9);
}

/* =========================================================================
   6. 圆亭（tholos）—— 小岛上的神庙
   ========================================================================= */
function tholos(V, CX, CY, CZ, R, H){
  // 台基
  discFill(V, CX, CY, CZ, R + 4, C.ivory2);
  ringFill(V, CX, CY + 1, CZ, R + 5, R + 3, C.ivory);
  discFill(V, CX, CY + 1, CZ, R + 3.2, C.ivory3);
  // 柱列
  const n = 14;
  for (let i = 0; i < n; i++){
    const a = i / n * Math.PI * 2;
    const x = CX + Math.cos(a) * R, z = CZ + Math.sin(a) * R;
    column(V, Math.round(x), Math.round(z), CY + 2, H, 3, {
      shaft: C.ivory, edge: C.ivory3, lite: C.cream, cap: C.ivory, base: C.ivory2, acc: C.gold
    });
  }
  // 鼓环
  ringFill(V, CX, CY + H + 2, CZ, R + 2, R - 2, C.ivory);
  ringFill(V, CX, CY + H + 3, CZ, R + 2, R - 2, C.gold);
  // 内殿
  cylinder(V, CX, CY + 2, CZ, R - 3.5, H, C.ochre2, { hollow: true, wall: 1.6 });
  // 穹顶
  dome(V, CX, CY + H + 4, CZ, R + 1.5, Math.round(R * 0.95), {
    main: C.ivory, rib: C.ivory3, gold: C.gold, ribs: 16, thick: 1.8
  });
  finial(V, CX, CY + H + 4 + Math.round(R * 0.95), CZ, 8, C.gold, C.goldHi);
}

/* =========================================================================
   7. 飞桥（拱桥）
   ========================================================================= */
function skyBridge(V, X0, X1, Z, Y, o){
  const span = Math.abs(X1 - X0);
  const half = o.width || 4;
  const steps = Math.ceil(span);
  for (let i = 0; i <= steps; i++){
    const t = i / steps;
    const x = X0 + (X1 - X0) * t;
    const lift = Math.sin(t * Math.PI) * (o.rise || 7);
    const y = Y + Math.round(lift);
    for (let dz = -half; dz <= half; dz++){
      V.s(Math.round(x), y, Z + dz, C.ivory2);
      V.s(Math.round(x), y + 1, Z + dz, ((Math.round(x) + dz) & 1) ? C.ivory : C.ivory3);
      // 栏杆
      if (Math.abs(dz) === half){
        V.s(Math.round(x), y + 2, Z + dz, C.ivory);
        if (i % 3 === 0) V.s(Math.round(x), y + 3, Z + dz, C.gold);
      }
    }
  }
  // 桥拱（下方）
  const midX = (X0 + X1) / 2;
  arch(V, midX, Y - (o.rise || 7) * 0.2, Z, span * 0.36, 1.6, half * 2 + 1, C.ivory3, C.ivory4);
  // 桥墩
  for (const px of [X0 + (X1 - X0) * 0.22, X0 + (X1 - X0) * 0.78]){
    for (let y = Y - 26; y <= Y; y++)
      for (let dz = -2; dz <= 2; dz++) V.s(Math.round(px), y, Z + dz, C.ivory3);
  }
}

/* =========================================================================
   8. 庭园构件 —— 喷泉 / 柏树 / 方尖碑 / 花坛
   ========================================================================= */
function fountain(V, cx, cy, cz, R){
  // 池壁（两级）
  ringFill(V, cx, cy + 1, cz, R, R - 1.6, C.ivory2);
  ringFill(V, cx, cy + 2, cz, R, R - 1.6, C.ivory);
  ringFill(V, cx, cy + 3, cz, R + 1.2, R - 0.4, C.ivory3);
  // 水面
  discFill(V, cx, cy + 2, cz, R - 1.7, C.water);
  discFill(V, cx, cy + 2, cz, R - 3.4, C.water2);
  // 中央基座
  cylinder(V, cx, cy + 2, cz, Math.max(2, R * 0.28), 4, C.ivory2, { solid: true });
  // 上层水盘
  ringFill(V, cx, cy + 6, cz, R * 0.55, Math.max(0, R * 0.55 - 1.2), C.ivory);
  discFill(V, cx, cy + 6, cz, R * 0.55 - 1.3, C.water2);
  // 柱身
  cylinder(V, cx, cy + 7, cz, 1.4, 5, C.ivory, { solid: true });
  ringFill(V, cx, cy + 12, cz, 3, 2, C.gold);
  finial(V, cx, cy + 13, cz, 5, C.gold, C.goldHi);
  // 池边四座雕像
  for (let i = 0; i < 4; i++){
    const a = i / 4 * Math.PI * 2 + Math.PI * 0.25;
    statue(V, Math.round(Math.cos(a) * (R + 2.5)), cy + 1, Math.round(Math.sin(a) * (R + 2.5)), C.ivory, C.ivory4, 9);
  }
}

/** 修剪成型的柏树 */
function cyprusTree(V, x, z, y, h, c1, c2){
  for (let i = 0; i < 3; i++) V.s(x, y + i, z, C.ochre3);
  for (let i = 0; i < h; i++){
    const t = i / h;
    let r = Math.round((1 - t) * (h * 0.16) + 0.4);
    if (i < 2) r = Math.max(1, r);
    for (let dx = -r; dx <= r; dx++)
      for (let dz = -r; dz <= r; dz++){
        if (dx * dx + dz * dz > r * r + 0.4) continue;
        V.s(x + dx, y + 3 + i, z + dz, ((dx + dz + i) & 1) ? c1 : c2);
      }
  }
}

/** 方尖碑 */
function obelisk(V, x, z, y, h){
  for (let i = 0; i < 3; i++){
    const w = 6 - i;
    for (let dx = -w; dx <= w; dx++)
      for (let dz = -w; dz <= w; dz++)
        V.s(x + dx, y + i, z + dz, i === 2 ? C.ivory : C.ivory2);
  }
  for (let i = 0; i < h; i++){
    const t = i / h;
    const w = Math.max(0, Math.round((1 - t) * 2.2));
    for (let dx = -w; dx <= w; dx++)
      for (let dz = -w; dz <= w; dz++)
        V.s(x + dx, y + 3 + i, z + dz, ((dx + dz) & 1) ? C.ivory : C.ivory2);
    // 四面凹槽
    if (w >= 1){
      V.s(x + w + 1, y + 3 + i, z, C.ivory3);
      V.s(x, y + 3 + i, z + w + 1, C.ivory3);
    }
  }
  finial(V, x, y + 3 + h, z, 5, C.gold, C.goldHi);
}

/** 几何式花园（东西对称一座，V.s 自动镜像） */
function gardenParterre(V, GX, GZ){
  const W = 12, D = 26;
  // 外框绿篱
  for (let x = GX - W; x <= GX + W; x++)
    for (let z = GZ - D; z <= GZ + D; z++){
      const onEdge = (x === GX - W || x === GX + W || z === GZ - D || z === GZ + D);
      if (!onEdge) continue;
      if (x * x + z * z > 73 * 73) continue;
      for (let i = 0; i < 3; i++)
        V.s(x, 1 + i, z, i === 2 ? C.hedge2 : C.hedge);
    }
  // 十字路径
  for (let x = GX - W + 1; x <= GX + W - 1; x++)
    for (let z = GZ - 2; z <= GZ + 2; z++) V.s(x, 1, z, C.ivory3);
  for (let z = GZ - D + 1; z <= GZ + D - 1; z++)
    for (let x = GX - 2; x <= GX + 2; x++) V.s(x, 1, z, C.ivory3);
  // 四块草坪
  for (const sx of [-1, 1]) for (const sz of [-1, 1]){
    for (let x = GX + sx * 4; x !== GX + sx * (W - 2); x += sx)
      for (let z = GZ + sz * 4; z !== GZ + sz * (D - 2); z += sz){
        if (x * x + z * z > 72 * 72) continue;
        V.s(x, 1, z, C.moss);
      }
  }
  // 中央圆池
  ringFill(V, GX, 1, GZ, 7, 5.8, C.ivory2);
  discFill(V, GX, 1, GZ, 5.9, C.water);
  statue(V, GX, 2, GZ, C.ivory, C.ivory4, 11);
  // 南北对称圆锥树
  for (const sz of [-1, 1]){
    const tz = GZ + sz * (D - 4);
    if (GX * GX + tz * tz > 73 * 73) continue;
    cyprusTree(V, GX, tz, 1, 13, C.hedge, C.hedge2);
  }
}

/* =========================================================================
   9. 城市总装 —— 浮空巨岛 + 巴洛克都城
   ========================================================================= */
const PY = 9;              // 主平台顶面 y
const ISLE_R = 82;         // 主岛半径

function trimVolute(V, x0, y0, z, dir, size, cA, cB){
  const steps = 52;
  for (let i = 0; i < steps; i++){
    const t = i / steps;
    const a = t * Math.PI * 3.4;
    const r = size * (1 - t * 0.80);
    const px = x0 + Math.round(Math.cos(a) * r) * dir;
    const py = y0 + Math.round(Math.sin(a) * r);
    V.p(px, py, z, cA);
    V.p(px, py, z + 1, cB);
    V.p(px, py, z - 1, cB);
  }
}

function buildBaroqueTrim(V){
  const ZF = -10, NX = 22, TOP = 42;
  for (let x = -NX - 3; x <= NX + 3; x++){
    V.p(x, TOP + 1, ZF - 1, C.ivory2);
    V.p(x, TOP + 2, ZF - 2, C.ivory);
    V.p(x, TOP + 3, ZF - 3, C.gold);
    V.p(x, TOP + 4, ZF - 3, C.goldHi);
    V.p(x, TOP + 5, ZF - 4, C.gold);
  }
  trimVolute(V, -19, TOP + 8, ZF - 3, 1, 7, C.gold, C.goldHi);
  trimVolute(V,  19, TOP + 8, ZF - 3, -1, 7, C.gold, C.goldHi);
  for (let x = -21; x <= 21; x += 6){
    if (Math.abs(x) < 5) continue;
    for (let y = TOP + 6; y <= TOP + 13; y++)
      V.p(x, y, ZF - 1, y % 3 === 0 ? C.gold : C.ivory3);
  }
}

function buildTerrace(V){
  const R = 78.2;
  // 石栏：横向扶手
  for (let a = 0; a < 360; a += 0.7){
    const rad = a * Math.PI / 180;
    V.p(Math.round(Math.cos(rad) * R), 2, Math.round(Math.sin(rad) * R), C.ivory3);
  }
  // 望柱 + 灯柱
  for (let a = 0; a < 360; a += 4){
    const rad = a * Math.PI / 180;
    const x = Math.round(Math.cos(rad) * R);
    const z = Math.round(Math.sin(rad) * R);
    V.p(x, 1, z, C.ivory2);
    V.p(x, 3, z, C.ivory);
    if (a % 36 === 0){
      for (let h = 4; h <= 12; h++) V.p(x, h, z, C.ivory);
      V.p(x, 13, z, C.gold);
      V.p(x, 14, z, C.goldLight);
      V.p(x, 15, z, C.gold);
      for (let d = -1; d <= 1; d++){
        V.p(x + d, 16, z, C.goldLight);
        V.p(x, 16, z + d, C.goldLight);
      }
    }
  }
  // 岛缘雕像基座（8 向）
  for (let i = 0; i < 8; i++){
    const a = i / 8 * Math.PI * 2 + Math.PI / 8;
    const x = Math.round(Math.cos(a) * 70);
    const z = Math.round(Math.sin(a) * 70);
    for (let dx = -2; dx <= 2; dx++)
      for (let dz = -2; dz <= 2; dz++)
        if (Math.abs(dx) + Math.abs(dz) < 3) V.p(x + dx, 1, z + dz, C.ivory2);
    for (let h = 2; h <= 5; h++) V.p(x, h, z, C.ivory);
    V.p(x, 6, z, C.ivory3);
    V.p(x, 7, z, C.ivory3);
    V.p(x, 8, z, C.ivory4);
    V.p(x, 9, z, C.gold);
  }
}

function buildOutskirts(V){
  const rnd = (a, b) => a + Math.random() * (b - a);
  const N = 26;
  for (let i = 0; i < N; i++){
    const a = (i / N) * Math.PI * 2 + rnd(-0.09, 0.09);
    const dist = rnd(430, 1560);
    const cx = Math.round(Math.cos(a) * dist);
    const cz = Math.round(Math.sin(a) * dist);
    const cy = Math.round(rnd(-40, -240));
    const R = Math.round(rnd(11, 33));
    islandRock(V, cx, cy, cz, R, Math.round(R * rnd(1.15, 2.15)), { rim: 2, rimColor: C.ivory4 });
    discFill(V, cx, cy, cz, R, Math.random() < 0.5 ? C.grass1 : C.grass2, false);
    if (R > 21 && Math.random() < 0.7){
      const h = Math.round(rnd(9, 34));
      column(V, cx, cz, cy + 1, h, 2, {});
      finial(V, cx, cy + h + 1, cz, 5, C.gold, C.goldLight);
    }
    if (R > 30 && Math.random() < 0.5){
      const tx = cx + Math.round(rnd(-R * 0.5, R * 0.5));
      const tz = cz + Math.round(rnd(-R * 0.5, R * 0.5));
      column(V, tx, tz, cy + 1, Math.round(rnd(6, 16)), 2, {});
    }
  }
}

function buildCity(V){
  const marks = {};

  /* ============ A. 主岛岩体 ============ */
  islandRock(V, 0, 0, 0, ISLE_R, 86, { rim: 2.8, rimColor: C.ivory4 });

  /* ============ B. 岛顶铺装（放射 + 棋盘 + 金轴） ============ */
  const R2 = ISLE_R * ISLE_R;
  for (let x = -ISLE_R; x <= ISLE_R; x++){
    for (let z = -ISLE_R; z <= ISLE_R; z++){
      const d2 = x * x + z * z;
      if (d2 > R2) continue;
      const d = Math.sqrt(d2);
      let c;
      if (d > ISLE_R - 3.5) c = C.ivory4;
      else if (Math.abs(x) <= 4 && z > 20) c = (Math.floor((z + 400) / 5) & 1) ? C.ochre2 : C.goldDeep;
      else if (Math.abs(d - 74) < 1.4) c = C.slate3;
      else if (Math.abs(d - 62) < 1.0) c = C.ivory;
      else {
        c = ((x + z) & 1) ? C.ivory3 : C.ivory2;
        const ray = Math.abs(Math.atan2(z, x)) % (Math.PI / 8);
        if (ray < 0.012) c = C.ivory4;
        if (((x * 7 + z * 13) & 127) === 0) c = C.ivory;
      }
      V.p(x, 0, z, c);
    }
  }

  /* ============ C. 主平台（教堂台地） ============ */
  plateau(V, -54, -58, 54, 22, PY, 0, C.ivory2, C.ivory3, C.ivory4);
  plateau(V, -40, -72, 40, -58, PY, 0, C.ivory2, C.ivory3, C.ivory4);

  for (let x = -54; x <= 54; x++)
    for (let z = -58; z <= 22; z++){
      const c = ((x + z) & 1) ? C.ivory2 : C.ivory3;
      let cc = c;
      if (Math.abs(x) <= 4) cc = (Math.floor((z + 400) / 5) & 1) ? C.ochre2 : C.goldDeep;
      else if (Math.abs(Math.abs(x) - Math.abs(z) - 20) < 1) cc = C.ivory;
      V.p(x, PY, z, cc);
    }
  for (let x = -40; x <= 40; x++)
    for (let z = -72; z <= -58; z++)
      V.p(x, PY, z, ((x + z) & 1) ? C.ivory2 : C.ivory3);

  // 平台边缘栏杆（南 / 东 / 西）
  balustrade(V, -54, 22, 54, 22, PY + 1, { post: C.ivory, rail: C.ivory, base: C.ivory3 });
  balustrade(V, 54, -58, 54, 22, PY + 1, { post: C.ivory, rail: C.ivory, base: C.ivory3 });
  balustrade(V, -54, -58, -54, 22, PY + 1, { post: C.ivory, rail: C.ivory, base: C.ivory3 });
  // 平台栏杆上的镀金尖饰
  for (const p of [[-54, 22], [54, 22], [-54, -58], [54, -58], [0, 22], [-30, 22], [30, 22]]){
    finial(V, p[0], PY + 5, p[1], 5, C.gold, C.goldHi);
  }

  /* ============ D. 大台阶 ============ */
  stairs(V, 0, 34, 22, 0, PY, 20, { a: C.ivory2, b: C.ivory3, edge: C.ivory, rail: C.gold });
  // 台阶两侧挡墙
  for (const sx of [-1, 1]){
    for (let z = 21; z <= 36; z++){
      for (let y = 0; y <= PY; y++){
        V.p(sx * 23, y, z, C.ivory2);
        V.p(sx * 24, y, z, C.ivory3);
      }
      V.p(sx * 23, PY + 1, z, C.ivory);
      V.p(sx * 24, PY + 1, z, C.ivory);
    }
  }
  statue(V, 24, PY + 2, 27, C.ivory, C.ivory4, 12);
  statue(V, 24, PY + 2, 33, C.ivory, C.ivory4, 12);

  /* ============ E. 下广场 —— 方尖碑 + 林荫 + 花坛 ============ */
  obelisk(V, 0, 52, 0, 34);
  marks.obelisk = new THREE.Vector3(0, 20, 52);
  for (const zz of [40, 49, 58, 67]){
    cyprusTree(V, 30, zz, 0, 15, C.hedge, C.hedge2);
    cyprusTree(V, 40, zz, 0, 17, C.hedge, C.hedge2);
  }
  // 环形花坛
  for (const cxz of [[0, 52]]){
    ringFill(V, cxz[0], 1, cxz[1], 14, 10.5, C.ivory2);
    ringFill(V, cxz[0], 1, cxz[1], 10.5, 9.5, C.moss);
  }
  // 南入口门柱
  for (const sx of [-1, 1]){
    for (let y = 0; y <= 16; y++){
      for (let dx = 0; dx <= 3; dx++)
        for (let dz = 0; dz <= 3; dz++)
          V.p(sx * (14 + dx), y, 70 + dz, (dx === 3 || dz === 3) ? C.ivory : C.ivory2);
    }
    finial(V, sx * 15, 17, 71, 6, C.gold, C.goldHi);
  }
  // 南侧锻铁栅栏
  for (let x = -13; x <= 13; x++){
    if (Math.abs(x) < 5) continue;
    V.p(x, 1, 73, C.slate4);
    V.p(x, 2, 73, C.slate3);
    V.p(x, 3, 73, C.slate4);
    if ((x & 1) === 0) V.p(x, 4, 73, C.gold);
  }
  V.p(0, 4, 73, C.gold);

  /* ============ F. 东西几何花园 ============ */
  gardenParterre(V, 66, 0);

  /* ============ G. 岛缘栏杆 + 檐口 ============ */
  const RR = 79;
  const STEPS = Math.round(Math.PI * 2 * RR);
  for (let i = 0; i < STEPS; i++){
    const a = i / STEPS * Math.PI * 2;
    const x = Math.round(Math.cos(a) * RR);
    const z = Math.round(Math.sin(a) * RR);
    if (z > 68 && Math.abs(x) < 17) continue;                 // 南入口
    if (Math.abs(x) > 68 && Math.abs(z - 30) < 10) continue;   // 瀑布口
    V.p(x, 1, z, C.ivory2);
    V.p(x, 4, z, C.ivory);
    if (i % 3 === 0){ V.p(x, 2, z, C.ivory3); V.p(x, 3, z, C.ivory3); }
    if (i % 26 === 0){
      V.p(x, 5, z, C.gold);
      V.p(x, 6, z, C.goldHi);
    }
  }
  ringFill(V, 0, 0, 0, ISLE_R, ISLE_R - 3.5, C.ivory4, false);
  ringFill(V, 0, -1, 0, ISLE_R - 1, ISLE_R - 4.5, C.rock1, false);
  ringFill(V, 0, -2, 0, ISLE_R - 2, ISLE_R - 6, C.rock2, false);

  /* ============ H. 大教堂 ============ */
  cathedral(V);
  marks.dome = new THREE.Vector3(0, 74, -48);
  marks.domeTop = new THREE.Vector3(0, 104, -48);
  marks.facade = new THREE.Vector3(0, 30, -8);

  /* ============ I. 中央喷泉 ============ */
  fountain(V, 0, PY, 4, 10);
  marks.fountain = new THREE.Vector3(0, PY + 8, 4);

  /* ============ J. 侧翼建筑 ============ */
  wing(V, 46, 8, -52, 26);
  // 教堂与侧翼之间的连廊
  for (const sx of [-1, 1]){
    for (let z = -46; z <= 4; z += 12){
      arch(V, sx * 30, PY + 10, z, 5, 1.4, 2, C.ivory, C.ivory3);
      for (let y = PY; y <= PY + 10; y++) V.p(sx * 24, y, z + 5, C.ivory2);
      for (let y = PY; y <= PY + 10; y++) V.p(sx * 36, y, z + 5, C.ivory2);
    }
  }

  /* ============ K. 东西浮岛 + 飞桥 ============ */
  const IX = 130, IZ = 8, IR = 26;
  for (const s of [1, -1]){
    islandRock(V, s * IX, 0, IZ, IR, 48, { rim: 2.2, rimColor: C.ivory4 });
    for (let x = -IR + 2; x <= IR - 2; x++)
      for (let z = -IR + 2; z <= IR - 2; z++){
        if (x * x + z * z > (IR - 2) * (IR - 2)) continue;
        const d = Math.sqrt(x * x + z * z);
        let c = ((x + z) & 1) ? C.ivory3 : C.ivory2;
        if (d > IR - 5) c = C.ivory4;
        if (Math.abs(d - 15) < 1.2) c = C.slate3;
        V.p(s * IX + x, 0, IZ + z, c);
      }
    // 岛缘栏杆
    for (let i = 0; i < Math.round(Math.PI * 2 * (IR - 3)); i++){
      const a = i / Math.round(Math.PI * 2 * (IR - 3)) * Math.PI * 2;
      const x = Math.round(s * IX + Math.cos(a) * (IR - 3));
      const z = Math.round(IZ + Math.sin(a) * (IR - 3));
      if (s > 0 && Math.abs(z - IZ) < 6 && x < s * IX) continue;
      if (s < 0 && Math.abs(z - IZ) < 6 && x > s * IX) continue;
      V.p(x, 1, z, C.ivory2);
      V.p(x, 3, z, C.ivory);
      if (i % 4 === 0) V.p(x, 2, z, C.ivory3);
    }
  }
  tholos(V, IX, 0, IZ, 12, 20);
  marks.eastIsle = new THREE.Vector3(IX, 12, IZ);
  marks.westIsle = new THREE.Vector3(-IX, 12, IZ);
  skyBridge(V, 80, 106, IZ, 0, { width: 4, rise: 8 });

  /* ============ L. 远景浮岛（装饰性） ============ */
  const far = [
    [0, -26, 210, 20, 30], [-190, 34, 150, 16, 24], [205, 48, 120, 14, 22],
    [-235, -12, -60, 18, 26], [180, -40, -170, 15, 24], [40, 62, -230, 22, 30],
  ];
  for (const f of far){
    islandRock(V, f[0], f[1], f[2], f[3], f[4], { rim: 2, rimColor: C.ivory4 });
    discFill(V, f[0], f[1], f[2], f[3] - 2, C.moss2, false);
    // 小尖塔
    finial(V, f[0], f[1] + 1, f[2], 6, C.ivory3);
  }

  return marks;
}

  uBot:    { value: new THREE.Color(0xa6c0da) },
  uSun:    { value: new THREE.Color(0xfff4d6) },
  uSunDir: { value: new THREE.Vector3(-0.56, 0.70, 0.36).normalize() },
  uNight:  { value: 0 },
  uTime:   { value: 0 },
};
const skyGeo = new THREE.SphereGeometry(3200, 40, 20);
const skyMat = new THREE.ShaderMaterial({
  uniforms: skyUni,
  side: THREE.BackSide,
  depthWrite: false,
  fog: false,
  vertexShader: `
    varying vec3 vDir;
    void main(){
      vDir = position;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform vec3 uTop, uMid, uBot, uSun, uSunDir;
    uniform float uNight, uTime;
    varying vec3 vDir;
    float hash(vec3 p){
      p = fract(p * 0.3183099 + vec3(0.11, 0.27, 0.39));
      p *= 17.0;
      return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
    }
    void main(){
      vec3 d = normalize(vDir);
      float hh = d.y;
      float up = clamp(hh, 0.0, 1.0);
      vec3 col = mix(uBot, uMid, smoothstep(0.0, 0.30, up));
      col = mix(col, uTop, smoothstep(0.20, 0.88, up));
      float dp = clamp(-hh * 1.9, 0.0, 1.0);
      vec3 abyss = mix(uBot * 0.62, vec3(0.24, 0.34, 0.52), 0.58);
      col = mix(col, abyss, smoothstep(0.0, 0.72, dp));
      vec3 sd = normalize(uSunDir);
      float sdot = max(dot(d, sd), 0.0);
      col += uSun * pow(sdot, 1400.0) * 5.0;
      col += uSun * pow(sdot, 28.0) * 0.50;
      col += uSun * pow(sdot, 4.5) * 0.16;
      float hz = exp(-pow(abs(hh - 0.010) / 0.075, 2.0));
      col += uSun * hz * 0.20;
      vec3 cell = floor(d * 320.0);
      float n = hash(cell);
      float star = step(0.9968, n) * uNight * smoothstep(0.02, 0.28, hh);
      star *= 0.55 + 0.45 * sin(uTime * 2.4 + n * 260.0);
      col += vec3(0.92, 0.96, 1.0) * star * 2.2;
      float band = exp(-pow((d.y - 0.42) / 0.26, 2.0));
      col += vec3(0.055, 0.065, 0.12) * band * uNight * (0.45 + 0.55 * hash(floor(d * 48.0)));
      gl_FragColor = vec4(col, 1.0);
    }
  `,
});

const boxGeo = new THREE.BoxGeometry(1, 1, 1);

function voxMeshes(vox, opt){
  opt = opt || {};
  const raw = surfaceList(vox);
  const byColor = new Map();
  for (let i = 0; i < raw.length; i += 4){
    const c = raw[i + 3];
    let a = byColor.get(c);
    if (!a){ a = []; byColor.set(c, a); }
    a.push(raw[i], raw[i + 1], raw[i + 2]);
  }
  const dummy = new THREE.Object3D();
  const out = [];
  let total = 0;
  for (const [color, a] of byColor){
    const n = a.length / 3;
    const im = new THREE.InstancedMesh(boxGeo, matFor(color), n);
    for (let i = 0; i < n; i++){
      dummy.position.set(a[i * 3], a[i * 3 + 1], a[i * 3 + 2]);
      dummy.updateMatrix();
      im.setMatrixAt(i, dummy.matrix);
    }
    im.instanceMatrix.needsUpdate = true;
    im.castShadow = !opt.noShadow;
    im.receiveShadow = !opt.noShadow;
    im.frustumCulled = false;
    out.push(im);
    total += n;
  }
  out.total = total;
  return out;
}

        const v = (x * x) / 225 + (y * y) / 34 + (z * z) / 35;

        let c = C.ivory;
        if (Math.abs(x % 6) < 1) c = C.red;
        if (Math.abs(x) > 12) c = C.goldDeep;
        if (Math.abs(y) > 4) c = C.ivory3;
        A.p(x, y, z, c);
      }
  for (let x = -6; x <= 6; x++)
    for (let y = -13; y <= -10; y++)
      for (let z = -3; z <= 3; z++){
        const edge = (x === -6 || x === 6 || z === -3 || z === 3 || y === -13);
        if (!edge) continue;
        A.p(x, y, z, y === -13 ? C.goldDeep : C.ochre3);
      }
  for (let x = -4; x <= 4; x += 2){ A.p(x, -11, 3, C.lamp); A.p(x, -11, -3, C.lamp); }
  for (const cx of [-5, 5]) for (const cz of [-2, 2]){
    for (let y = -10; y <= -6; y++) A.p(cx, y, cz, C.goldDark);
  }
  for (let x = -18; x <= -15; x++){
    for (let y = -3; y <= 3; y++) A.p(x, y, 0, y === 0 ? C.gold : C.red);
    for (let z = -5; z <= 5; z++) A.p(x, 0, z, Math.abs(z) < 2 ? C.gold : C.red);
  }
  for (const cz of [-3, 3]) for (let y = -13; y <= -11; y++) A.p(7, y, cz, C.bronze);
  return voxMeshes(A, {});
}

const CAM = {
  theta: 0.62, phi: 1.30, dist: 288,
  tTheta: 0.62, tPhi: 1.30, tDist: 288,
  look: new THREE.Vector3(0, 36, -10),
  tLook: new THREE.Vector3(0, 36, -10),
  auto: true,
};
const D_MIN = 78, D_MAX = 980, PHI_MIN = 0.20, PHI_MAX = 1.60;
const clamp = (v, a, b) => (v < a ? a : (v > b ? b : v));

function camApply(dt){
  const k = 1 - Math.pow(0.0018, dt);
  CAM.theta += (CAM.tTheta - CAM.theta) * k;
  CAM.phi   += (CAM.tPhi   - CAM.phi)   * k;
  CAM.dist  += (CAM.tDist  - CAM.dist)  * k;
  CAM.look.lerp(CAM.tLook, k);
  if (CAM.auto) CAM.tTheta += dt * 0.032;
  const sp = Math.sin(CAM.phi), cp = Math.cos(CAM.phi);
  camera.position.set(
    CAM.look.x + CAM.dist * sp * Math.sin(CAM.theta),
    CAM.look.y + CAM.dist * cp,
    CAM.look.z + CAM.dist * sp * Math.cos(CAM.theta)
  );
  camera.lookAt(CAM.look);
}

function updatePulses(dt){
  for (let i = pulses.length - 1; i >= 0; i--){
    const p = pulses[i];
    p.t += dt;
    const u = p.t / p.dur;
    if (u >= 1){
      scene.remove(p.m);
      p.m.geometry.dispose();
      p.m.material.dispose();
      pulses.splice(i, 1);
      continue;
    }
    p.m.scale.setScalar(1.2 + u * p.size);
    p.m.material.opacity = 0.62 * (1 - u) * (1 - u);
  }
}

/* =========================================================================
   23. 交互 —— 拖拽 / 缩放 / 触摸 / 点击
   ========================================================================= */
let dayTarget = 0, cloudSurge = 0, cityGlowFlash = 0, cameraShake = 0;

const pointers = new Map();
let pinchPrev = 0, movedPx = 0, downTime = 0;

canvas.addEventListener('pointerdown', (e) => {
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  if (pointers.size === 1){ movedPx = 0; downTime = performance.now(); }
  CAM.auto = false;
  canvas.classList.add('dragging');
});

canvas.addEventListener('pointermove', (e) => {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  if (pointers.size === 1){
    CAM.tTheta -= dx * 0.0058;
    CAM.tPhi = clamp(CAM.tPhi - dy * 0.0046, PHI_MIN, PHI_MAX);
    movedPx += Math.abs(dx) + Math.abs(dy);
  } else if (pointers.size >= 2){
    const arr = Array.from(pointers.values());
    const d = Math.hypot(arr[0].x - arr[1].x, arr[0].y - arr[1].y);
    if (pinchPrev > 0) CAM.tDist = clamp(CAM.tDist * (pinchPrev / Math.max(1, d)), D_MIN, D_MAX);
    pinchPrev = d;
    movedPx += 24;
  }
  CAM.auto = false;
});

function endPointer(e){
  const had = pointers.has(e.pointerId);
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinchPrev = 0;
  if (pointers.size === 0){
    canvas.classList.remove('dragging');
    if (had && movedPx < 9 && performance.now() - downTime < 540){
      handleClick(e.clientX, e.clientY);
    }
    setTimeout(() => { if (pointers.size === 0) CAM.auto = true; }, 5200);
  }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const k = e.deltaMode === 1 ? 18 : (e.deltaMode === 2 ? 120 : 1);
  CAM.tDist = clamp(CAM.tDist * (1 + e.deltaY * k * 0.0011), D_MIN, D_MAX);
  CAM.auto = false;
  setTimeout(() => { CAM.auto = true; }, 4200);
}, { passive: false });

/* ---------- 拾取 ---------- */
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();

function handleClick(cx, cy){
  ndc.x = (cx / window.innerWidth) * 2 - 1;
  ndc.y = -(cy / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObjects(proxies, false);
  ripple(cx, cy);
  if (!hits.length) return;
  react(hits[0].object.userData.name);
}

function react(name){
  if (name === 'dome'){
    spawnPulse(marks.domeTop, 0xffd27a, 44, 1.5);
    spawnPulse(marks.dome, 0xffe6a8, 30, 1.1);
    burst(marks.domeTop.x, marks.domeTop.y + 6, marks.domeTop.z, 70, 22, 5);
    cityGlowFlash = 1;
    cameraShake = 0.55;
    toast('钟声荡开 · 穹顶金光大盛');
  } else if (name === 'fountain'){
    spawnPulse(marks.fountain, 0x9fe4f2, 16, 0.9);
    burst(marks.fountain.x, marks.fountain.y + 14, marks.fountain.z, 160, 26, 3);
    toast('喷泉轰然腾起');
  } else if (name === 'facade'){
    spawnPulse(marks.facade, 0xffe0a0, 34, 1.2);
    cameraShake = 0.3;
    toast('巨柱回响');
  } else if (name === 'isleE' || name === 'isleW'){
    if (name === 'isleE') isleTE = isleTE > 0 ? 0 : 26;
    else isleTW = isleTW > 0 ? 0 : 26;
    spawnPulse(name === 'isleE' ? marks.eastIsle : marks.westIsle, 0xa8d8ff, 36, 1.3);
    toast(name === 'isleE' ? '东浮岛缓缓升空' : '西浮岛缓缓升空');
  } else if (name === 'fallE' || name === 'fallW'){
    const sx = name === 'fallE' ? 82 : -82;
    spawnPulse(new THREE.Vector3(sx, -34, 30), 0xbfeaf8, 30, 1.1);
    burst(sx, -22, 30, 180, 30, 7);
    toast('水雾炸开');
  } else if (name === 'stairs'){
    burst(0, 4, 34, 80, 15, 17);
    toast('阶前风起');
  }
}

/* =========================================================================
   24. 每帧更新
   ========================================================================= */
const dummyObj = new THREE.Object3D();

function updateClouds(t){
  for (let i = 0; i < cloudMeshes.length; i++){
    const m = cloudMeshes[i];
    m.position.y = Math.sin(t * 0.22 + i * 1.7) * 4 + cloudSurge * (12 + i * 6);
    m.rotation.y = t * 0.0042 * (i % 2 ? 1 : -1) * (1 + cloudSurge * 2.6);
  }
  cloudSurge *= 0.986;
}

function updateWaterfall(t, dt){
  if (!fallIM) return;
  const d = dummyObj;
  for (let i = 0; i < FALL_N; i++){
    const p = fallParts[i];
    p.y -= p.v * dt;
    if (p.y < -134){ p.y = 2; p.z = 30 + (Math.random() - 0.5) * 10; }
    const off = Math.min(6, (-p.y) / 128 * 6) * Math.sign(p.side);
    d.position.set(p.side * 80 + off, p.y, p.z + Math.sin(t * 2.2 + i * 0.7) * 0.5);
    d.scale.set(p.s, p.s * 2.2, p.s);
    d.rotation.set(0, 0, 0);
    d.updateMatrix();
    fallIM.setMatrixAt(i, d.matrix);
  }
  fallIM.instanceMatrix.needsUpdate = true;
}

let airshipPhase = 0, airshipBoost = 0;
function updateAirship(t, dt){
  airshipPhase += dt * (0.135 + airshipBoost * 0.6);
  airshipBoost *= Math.pow(0.4, dt);
  const a = airshipPhase;
  airship.position.set(
    Math.cos(a) * 182,
    68 + Math.sin(a * 2.2) * 13,
    Math.sin(a) * 152 - 6
  );
  airship.rotation.set(0, -a - Math.PI * 0.5, Math.sin(a * 2.2) * 0.07);
}

function updateBirds(t){
  if (!birdIM) return;
  const d = dummyObj;
  let idx = 0;
  for (let bi = 0; bi < birds.length; bi++){
    const b = birds[bi];
    const a = t * b.speed + b.phase;
    const th = -a - Math.PI * 0.5;
    const bx = Math.cos(a) * b.R;
    const bz = Math.sin(a) * b.R;
    const by = b.y + Math.sin(a * 3.1 + b.phase) * 4;
    d.position.set(bx, by, bz);
    d.rotation.set(0, th, 0);
    d.scale.set(0.5, 0.32, 1.5);
    d.updateMatrix();
    birdIM.setMatrixAt(idx++, d.matrix);
    const flap = Math.sin(t * 7.5 + b.flap) * 0.62;
    const ox = Math.sin(th), oz = Math.cos(th);
    for (const s of [-1, 1]){
      d.position.set(bx + ox * 1.05 * s, by + 0.08, bz + oz * 1.05 * s);
      d.rotation.set(0, th, flap * s);
      d.scale.set(2.3, 0.16, 0.72);
      d.updateMatrix();
      birdIM.setMatrixAt(idx++, d.matrix);
    }
  }
  birdIM.count = idx;
  birdIM.instanceMatrix.needsUpdate = true;
}

function updateFlags(t){
  if (!flagIM) return;
  const d = dummyObj;
  let idx = 0;
  for (let fi = 0; fi < flags.length; fi++){
    const f = flags[fi];
    f.boost *= 0.988;
    const amp = 0.4 + f.boost * 1.8 + flagBoostAll * 1.4;
    for (let r = 0; r < FLAG_ROWS; r++){
      for (let c = 0; c < FLAG_COLS; c++){
        const w = Math.sin(t * 3.4 + f.seed + c * 0.82 + r * 0.24) * amp * (c / FLAG_COLS);
        const dir = Math.sin(t * 1.7 + f.seed) * 0.22;
        d.position.set(
          f.x + Math.cos(dir) * (c + 1) * 0.94 * f.sc,
          f.y - (r + 0.5) * 0.94 * f.sc,
          f.z + (w + Math.sin(dir) * (c + 1) * 0.94) * f.sc
        );
        d.rotation.set(0, w * 0.6, 0);
        d.scale.setScalar(0.9 * f.sc);
        d.updateMatrix();
        flagIM.setMatrixAt(idx++, d.matrix);
      }
    }
  }
  flagIM.count = idx;
  flagIM.instanceMatrix.needsUpdate = true;
  flagBoostAll *= 0.985;
}

function updateSparks(dt){
  if (!sparkIM) return;
  const d = dummyObj;
  for (let i = 0; i < SPARK_N; i++){
    const p = sparks[i];
    if (p.life > 0){
      p.life -= dt;
      p.vy -= 17 * dt;
      p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
      const u = Math.max(0, p.life / p.max);
      d.position.set(p.x, p.y, p.z);
      d.scale.setScalar(p.s * (0.25 + u * 0.9));
      d.rotation.set(p.x * 0.7, p.y * 0.7, 0);
    } else {
      d.position.set(0, -9999, 0);
      d.scale.setScalar(0.001);
    }
    d.updateMatrix();
    sparkIM.setMatrixAt(i, d.matrix);
  }
  sparkIM.instanceMatrix.needsUpdate = true;
}

/* ---------- 昼夜 ---------- */
let dayMix = 0;
const SKY_DAY = { top: new THREE.Color(0x0a2456), mid: new THREE.Color(0x5b86c6), bot: new THREE.Color(0xa6c0da) };
const SKY_NIGHT = { top: new THREE.Color(0x04060e), mid: new THREE.Color(0x0b1430), bot: new THREE.Color(0x18203c) };
const FOG_DAY = new THREE.Color(0xd3e0ec), FOG_NIGHT = new THREE.Color(0x0a1224);

function updateDayNight(dt){
  if (Math.abs(dayTarget - dayMix) < 0.0006) dayMix = dayTarget;
  else dayMix += (dayTarget - dayMix) * (1 - Math.pow(0.06, dt));
  const n = dayMix;
  skyUni.uTop.value.copy(SKY_DAY.top).lerp(SKY_NIGHT.top, n);
  skyUni.uMid.value.copy(SKY_DAY.mid).lerp(SKY_NIGHT.mid, n);
  skyUni.uBot.value.copy(SKY_DAY.bot).lerp(SKY_NIGHT.bot, n);
  skyUni.uNight.value = n;
  scene.fog.color.copy(FOG_DAY).lerp(FOG_NIGHT, n);
  sun.intensity = 2.3 * (1 - n * 0.94);
  hemi.intensity = 0.30 * Math.max(0.10, 1 - n * 0.72);
  fill.intensity = 0.16 * (1 - n * 0.62);
  cityGlow.intensity = 2.7 * n + cityGlowFlash * 3.4;
  cityGlowFlash *= Math.pow(0.12, dt);
  const le = 0.15 + n * 2.7;
  for (let i = 0; i < lampMats.length; i++) lampMats[i].emissiveIntensity = le;
  renderer.toneMappingExposure = 0.96 - n * 0.14;
}

function updateGlows(t){
  for (let i = 0; i < glows.length; i++){
    const g = glows[i];
    const pulse = 0.55 + 0.45 * Math.sin(t * 1.3 + i * 2.1);
    g.material.opacity = (0.3 + pulse * 0.42) * (0.55 + dayMix * 0.95);
    g.scale.setScalar((g.userData.base || 20) * (0.96 + pulse * 0.09));
  }
}

function shakeApply(dt){
  if (cameraShake > 0.002){
    cameraShake *= Math.pow(0.02, dt);
    camera.position.x += (Math.random() - 0.5) * cameraShake * 3;
    camera.position.y += (Math.random() - 0.5) * cameraShake * 3;
    camera.position.z += (Math.random() - 0.5) * cameraShake * 3;
  } else cameraShake = 0;
}

/* =========================================================================
   25. 主循环
   ========================================================================= */
let isleGroupE = null, isleGroupW = null;
const clock = new THREE.Clock();
const statsEl = document.getElementById('fps');
let fpsAcc = 0, fpsCount = 0;

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.055);
  const t = clock.elapsedTime;

  camApply(dt);
  shakeApply(dt);
  updateClouds(t);
  updateWaterfall(t, dt);
  updateAirship(t, dt);
  updateBirds(t);
  updateFlags(t);
  updateSparks(dt);
  updatePulses(dt);
  updateDayNight(dt);
  updateGlows(t);

  skyUni.uTime.value = t;
  skyDome.position.copy(camera.position);

  isleE += (isleTE - isleE) * (1 - Math.pow(0.22, dt));
  isleW += (isleTW - isleW) * (1 - Math.pow(0.22, dt));
  if (isleGroupE) isleGroupE.position.y = isleE;
  if (isleGroupW) isleGroupW.position.y = isleW;

  composer.render();

  fpsAcc += dt; fpsCount++;
  if (fpsAcc > 0.5){
    if (statsEl) statsEl.textContent = Math.round(fpsCount / fpsAcc) + ' FPS';
    fpsAcc = 0; fpsCount = 0;
  }
}
